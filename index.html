<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>3BHK Walkthrough</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H4z' fill='%23c4552c'/%3E%3C/svg%3E" />
  <style>
    :root { --ink: #1d1b18; --paper: rgba(250, 248, 243, 0.93); --accent: #c4552c; }
    html, body { margin: 0; height: 100%; background: #0f0e0d; overflow: hidden; font-family: Inter, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
    #app canvas { display: block; }
    #loader { position: fixed; inset: 0; display: grid; place-items: center; background: #f4f1ea; z-index: 10; transition: opacity .6s; }
    #loader div { text-align: center; }
    #loader h1 { font-weight: 600; font-size: 22px; letter-spacing: .02em; margin: 0 0 6px; }
    #loader p { margin: 0; color: #6b655c; font-size: 14px; }
    #loader .bar { width: 160px; height: 3px; background: #e2ddd3; margin: 18px auto 0; overflow: hidden; border-radius: 2px; }
    #loader .bar i { display: block; height: 100%; width: 40%; background: var(--accent); animation: slide 1.1s infinite ease-in-out; }
    #loader.determinate .bar i { animation: none; transition: width .25s; }
    #loader p { min-height: 1.3em; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    body.loaded #loader { opacity: 0; pointer-events: none; }
    body.loaded #loader .bar i { animation: none; }
    /* no backdrop-filter: blurring the live 3D canvas behind four panels re-ran every frame and cost real GPU time on weak machines */
    .panel { position: fixed; background: var(--paper); border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
    #room { left: 16px; top: 16px; padding: 10px 14px; font-size: 13px; min-width: 120px; }
    #room b { display: block; font-size: 15px; font-weight: 600; }
    #room span { color: #6b655c; }
    #room:empty { display: none; }
    #minimap-wrap { right: 16px; top: 16px; padding: 8px; }
    #minimap { width: 210px; height: 246px; display: block; cursor: crosshair; border-radius: 6px; }
    #jump { left: 16px; bottom: 16px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(560px, calc(100vw - 32px)); }
    #jump button { font: 500 12px Inter, sans-serif; border: 0; background: #fff; color: var(--ink); padding: 7px 10px; border-radius: 8px; cursor: pointer; }
    #jump button:hover { background: var(--accent); color: #fff; }
    #help { right: 16px; bottom: 16px; padding: 10px 14px; font-size: 12px; color: #4a453e; line-height: 1.6; }
    #help button { font: 600 11px Inter, system-ui, sans-serif; border: 0; background: #fff; color: var(--ink); padding: 2px 8px; border-radius: 6px; cursor: pointer; box-shadow: 0 1px 0 #d5cfc4; }
    #help button:hover { background: var(--accent); color: #fff; }
    #help kbd { font: 600 11px Inter, sans-serif; background: #fff; border-radius: 4px; padding: 1px 5px; box-shadow: 0 1px 0 #d5cfc4; }
    #toast { left: 50%; top: 16px; transform: translate(-50%, -8px); padding: 8px 16px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 5; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 0 1px rgba(0,0,0,.25); display: none; }
    body.locked #cross { display: block; }
    body.locked #help .click { display: none; }
    body.shot .panel, body.shot #cross, body.shot #loader { display: none !important; }
    @media (max-width: 700px) {
      #minimap { width: 130px; height: 152px; }
      #help .keys { display: none; }
      #help { bottom: auto; top: 70px; left: 16px; right: auto; padding: 6px 10px; }
      #jump { bottom: 12px; left: 12px; right: 12px; max-width: none; overflow-x: auto; flex-wrap: nowrap; }
      #jump button { flex: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loader"><div><h1>3BHK Apartment</h1><p>Loading furniture &amp; finishes&hellip;</p><div class="bar"><i></i></div></div></div>
  <div id="room" class="panel"></div>
  <div id="minimap-wrap" class="panel"><canvas id="minimap" width="420" height="492"></canvas></div>
  <div id="jump" class="panel"></div>
  <div id="help" class="panel"><span class="keys"><span class="click">Click to look around<br></span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk &middot; <kbd>Shift</kbd> faster &middot; <kbd>Esc</kbd> release<br>Click the map to jump &middot; <kbd>Q</kbd> </span>quality: <button id="quality" title="Cycle graphics quality: Auto, High, Medium, Low">Auto</button></div>
  <div id="toast" class="panel" role="status" aria-live="polite"></div>
  <div id="cross"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
